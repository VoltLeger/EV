name: Build & Release Debug APK

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
      - 'V*'
      - '[0-9]*'
  pull_request:
  release:
    types: [published, created]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create or update a GitHub Release for this run'
        required: false
        default: true
        type: boolean
      release_tag:
        description: 'Tag for the release (e.g. v2.4)'
        required: false
        default: 'v2.4'
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Debug APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK Licenses & Install Components
        run: |
          ANDROID_SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          mkdir -p "$ANDROID_SDK/licenses" || true
          yes | $ANDROID_SDK/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_SDK/cmdline-tools/latest/bin/sdkmanager "platforms;android-36.1" "platforms;android-36" "build-tools;36.0.0" || true

