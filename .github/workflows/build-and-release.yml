name: Build & Release Debug APK

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
      - 'V*'
      - '[0-9]*'
  pull_request:
  release:
    types: [published, created]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create or update a GitHub Release for this run'
        required: false
        default: true
        type: boolean
      release_tag:
        description: 'Tag for the release (e.g. v2.3.3)'
        required: false
        default: 'v2.3.3'
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Debug APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK Licenses & Install Components
        run: |
          ANDROID_SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          mkdir -p "$ANDROID_SDK/licenses" || true
          yes | $ANDROID_SDK/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_SDK/cmdline-tools/latest/bin/sdkmanager "platforms;android-36.1" "platforms;android-36" "build-tools;36.0.0" || true

      - name: Prepare environment & signing
        run: |
          touch .env

          if [ ! -s "debug.keystore" ] && [ -f "debug.keystore.base64" ]; then
            echo "Decoding debug.keystore from debug.keystore.base64..."
            base64 -d debug.keystore.base64 > debug.keystore 2>/dev/null || base64 --decode debug.keystore.base64 > debug.keystore 2>/dev/null || true
          fi

          if [ ! -s "debug.keystore" ]; then
            echo "Generating fallback debug.keystore..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

          ls -la debug.keystore
          chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --no-configuration-cache --stacktrace --console=plain -Dorg.gradle.workers.max=2 -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=512m"

      - name: Prepare APK for distribution
        run: |
          mkdir -p release-artifacts
          VERSION_TAG="${{ github.ref_name }}"
          if [ "${{ github.event_name }}" = "release" ]; then
            VERSION_TAG="${{ github.event.release.tag_name }}"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.release_tag }}" ]; then
            VERSION_TAG="${{ inputs.release_tag }}"
          fi
          if [ -z "$VERSION_TAG" ] || [ "$VERSION_TAG" = "main" ] || [ "$VERSION_TAG" = "master" ]; then
            VERSION_TAG="v2.3.3"
          fi
          cp app/build/outputs/apk/debug/app-debug.apk release-artifacts/VoltLedger-${VERSION_TAG}.apk
          ls -la release-artifacts/

      - name: Upload Debug APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoltLedger-apk
          path: release-artifacts/*.apk
          retention-days: 30

      - name: Publish or Update GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.create_release == true)
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*.apk
          name: ${{ github.event_name == 'release' && github.event.release.name || (startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.release_tag) }}
          tag_name: ${{ github.event_name == 'release' && github.event.release.tag_name || (startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.release_tag) }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
